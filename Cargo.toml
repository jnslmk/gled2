[package]
name = "gled"
version = "2.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
artnet_protocol = "0.4"
chrono = "0.4"
clap = { version = "4.2", features = ["derive"] }
eframe = { version = "0.25", features = ["wgpu"] }
egui = { version = "0.25", features = ["persistence"] }
egui_extras = { version = "0.25", features = ["image"] }
fern = { version = "0.6", features = ["colored"] }
gilrs = "0.10"
gled_proc_macros = { path = "proc_macros" }
home = "0.5"
image = { version = "0.24", default-features = false, features = ["png"] }
kurbo = "0.10"
log = "0.4"
once_cell = "1.17"
resvg = { version = "0.37", default-features = false }
rfd = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svgdom = "0.18"
strum = { version = "0.25", features = ["derive"] }
tiny-skia = { version = "0.11", default-features = false, features = [
    "simd",
    "std",
] }
usvg = "0.37"
wgpu = "0.18"
rand = "0.8"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"

[profile.dev.package."*"]
opt-level = 3
