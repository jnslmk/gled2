[package]
name = "egui-wgpu-example"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
artnet_protocol = "0.4"
chrono = "0.4"
clap = { version = "4.2", features = ["derive"] }
eframe = { version = "0.21", features = ["wgpu"] }
egui = "0.21"
fern = { version = "0.6", features = ["colored"] }
kurbo = "0.9"
log = "0.4"
once_cell = "1.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slab = "0.4"
svgdom = "0.18"
usvg = "0.30"
wgpu = "0.15"

[profile.release]
lto = "fat"
