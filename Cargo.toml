[package]
name = "gled"
description = "gled is an application for creating animations and effects on artnet or dmx installations"
version = "2.16.0"
edition = "2024"
repository = "https://gitlab.com/photonenkollektiv/gled2"
homepage = "https://photonenkollektiv.gitlab.io/gled2"
documentation = "https://photonenkollektiv.gitlab.io/gled2"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
arboard = "3"
artnet_protocol = "0.4"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.32", features = [
    "wgpu",
    "default_fonts",
    "wayland",
], default-features = false }
egui = { version = "0.32", features = ["persistence"] }
egui_dnd = "0.13"
egui_extras = { version = "0.32", features = ["image", "syntect"] }
egui_ltreeview = { version = "0.5", features = ["persistence"] }
egui_flex = "0.4"
egui-modal.git = "https://github.com/LinoBigatti/egui-modal"
emath = "0.32"
epaint = "0.32"
env_logger = "0.11"
gilrs = "0.11"
home = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
kurbo = "0.11"
log = "0.4"
midir = { version = "0.10", features = ["winrt"] }
naga = "25"
once_cell = "1.20"
rayon = "1.10"
resvg = { version = "0.45", default-features = false }
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde-hjson = "1"
serde_json = "1"
serialport = "4"
svgdom = "0.18"
static_assertions = "1"
strum = { version = "0.27", features = ["derive"] }
sysinfo = "0.37"
tiny-skia = { version = "0.11", default-features = false, features = [
    "simd",
    "std",
] }
open = "5"
uuid = { version = "1", features = ["v4", "serde"] }
usvg = "0.45"
wgpu = "25"
rand = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
network-interface = "2"
directories = "6"
git2 = "0.20"
whoami = "1.5"
mkdirp = "1.0"
typemap = "0.3"
polyfit-residuals = "0.6"
polyfit-rs = "0.2"
ndarray = "0.16"
notify-rust = { version = "4", default-features = false, features = ["d"] }

[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.dev.package."*"]
opt-level = 3

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gled", dest = "/usr/bin/gled", mode = "555" },
    { source = ".rpm/de.photonenkollektiv.gled.desktop", dest = "/usr/share/applications/de.photonenkollektiv.gled.desktop", mode = "444" },
    { source = ".rpm/gled.repo", dest = "/etc/yum.repos.d/gled.repo", mode = "444" },
    { source = "logo/logo.svg", dest = "/usr/share/icons/application-gled.svg", mode = "444" },
]

[package.metadata.packager]
product-name = "Gled"
identifier = "de.photonenkollektiv.gled"
resources = ["logo/logo.png", "logo/logo.icns"]
icons = ["logo/logo.png", "logo/logo.icns"]
macos = { "signingIdentity" = "Developer ID Application: FreshX GmbH (V5GQY7AUWA)" }
