[package]
name = "gled"
version = "2.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
artnet_protocol = "0.4"
chrono = "0.4"
clap = { version = "4.2", features = ["derive"] }
eframe = { version = "0.21", features = ["wgpu"] }
egui = "0.21"
egui_extras = "0.21"
fern = { version = "0.6", features = ["colored"] }
floating-duration = "0.1.2"
image = { version = "0.24", default-features = false, features = ["png"] }
kurbo = "0.9"
log = "0.4"
once_cell = "1.17"
resvg = { version = "0.30", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slab = "0.4"
svgdom = "0.18"
tiny-skia = { version = "0.8", default-features = false, features = [
    "simd",
    "std",
] }
usvg = "0.30"
wgpu = "0.15"

[profile.release]
lto = "fat"

[profile.dev.package."*"]
opt-level = 3
