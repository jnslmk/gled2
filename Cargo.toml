[package]
name = "gled"
version = "2.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
artnet_protocol = "0.4"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", features = [
    "wgpu",
    "default_fonts",
    "wayland",
], default-features = false }
egui = { version = "0.29", features = ["persistence"] }
egui_extras = { version = "0.29", features = ["image"] }
egui_ltreeview.git = "https://github.com/elwerene/egui_ltreeview.git"
fern = { version = "0.7", features = ["colored"] }
gilrs = "0.11"
gled_proc_macros = { path = "proc_macros" }
home = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
kurbo = "0.11"
log = "0.4"
once_cell = "1.20"
rayon = "1.10"
resvg = { version = "0.44", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde-hjson = "1"
simd-json = "0.14"
svgdom = "0.18"
strum = { version = "0.26", features = ["derive"] }
tiny-skia = { version = "0.11", default-features = false, features = [
    "simd",
    "std",
] }
uuid = { version = "1", features = ["v4", "serde"] }
usvg = "0.44"
wgpu = "22"
rand = "0.8"
network-interface = "2"
directories = "5.0"
git2 = "0.19"
whoami = "1.5"
mkdirp = "1.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"

[profile.dev.package."*"]
opt-level = 3
