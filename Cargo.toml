[package]
name = "gled"
description = "gled is an application for creating animations and effects on artnet or wled light installations"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
arboard = "3"
artnet_protocol = "0.4"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.29", features = [
    "wgpu",
    "default_fonts",
    "wayland",
], default-features = false }
egui = { version = "0.29", features = ["persistence"] }
egui_extras = { version = "0.29", features = ["image", "syntect"] }
egui_flex = "0.1"
egui_ltreeview.git = "https://github.com/elwerene/egui_ltreeview.git"
emath = "0.29"
epaint = "0.29"
fern = { version = "0.7", features = ["colored"] }
gilrs = "0.11"
home = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
kurbo = "0.11"
log = "0.4"
naga = "22"
once_cell = "1.20"
openssl-sys = { version = "0.9", features = ["vendored"] }
rayon = "1.10"
resvg = { version = "0.44", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde-hjson = "1"
serde_json = "1"
svgdom = "0.18"
static_assertions = "1"
strum = { version = "0.26", features = ["derive"] }
sysinfo = "0.33"
tiny-skia = { version = "0.11", default-features = false, features = [
    "simd",
    "std",
] }
uuid = { version = "1", features = ["v4", "serde"] }
usvg = "0.44"
wgpu = "22"
rand = "0.8"
network-interface = "2"
directories = "5.0"
git2 = "0.19"
whoami = "1.5"
mkdirp = "1.0"
typemap = "0.3"
polyfit-residuals = "0.6"
polyfit-rs = "0.2"
ndarray = "0.16"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
debug = true

[profile.dev.package."*"]
opt-level = 3

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gled", dest = "/usr/bin/gled", mode = "755" },
    { source = ".rpm/gled.desktop", dest = "/usr/share/applications/gled.desktop", mode = "555" },
    { source = "assets/logo.svg", dest = "/usr/share/icons/application-gled.svg", mode = "555" },
]

[package.metadata.packager]
product-name = "Gled"
identifier = "de.photonenkollektiv.gled"
resources = ["assets/logo.png", "assets/logo.icns"]
icons = ["assets/logo.png", "assets/logo.icns"]
macos = { "signingIdentity" = "Developer ID Application: FreshX GmbH (V5GQY7AUWA)" }
