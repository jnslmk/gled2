[package]
name = "gled"
description = "gled is an application for creating animations and effects on artnet or dmx installations"
version = "2.27.12"
edition = "2024"
repository = "https://gitlab.com/photonenkollektiv/gled2"
homepage = "https://photonenkollektiv.gitlab.io/gled2"
documentation = "https://photonenkollektiv.gitlab.io/gled2"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
arboard = "3"
artnet_protocol = "0.4"
atomic_enum = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = "4"
cpal = "0.17"
deku = "0.20"
directories = "6"
eframe = { version = "0.34", features = [
    "wgpu",
    "default_fonts",
    "wayland",
], default-features = false }
egui = { version = "0.34", features = ["persistence"] }
egui_dnd = "0.15"
egui_extras = { version = "0.34", features = ["image", "syntect"] }
egui_flex = "0.6"
egui_knob = "0.3"
egui_ltreeview = "0.7"
egui_phosphor_icons = "0.3"
emath = "0.34"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
epaint = "0.34"
gilrs = "0.11"
git2 = "0.20"
home = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
kanal = "0.1"
keyring-core = "1"
kurbo = "0.13"

midir = { version = "0.11", features = ["winrt"] }
mkdirp = "1"
naga = "29"
ndarray = "0.17"
notify-rust = { version = "4", default-features = false, features = ["d"] }
once_cell = "1"
open = "5"
rtrb = "0.3.2"
polyfit-residuals = "0.6"
rand = "0.10"
rayon = "1.10"
reqwest = { version = "0.13", features = ["blocking", "json"] }
resvg = { version = "0.47", default-features = false }
rfd = "0.17"
rustfft = "6"
rusty_link = "0.4"
rosc = "0.11.4"
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde-hjson = "1"
serde_json = "1"
serialport = "4"
static_assertions = "1"
strum = { version = "0.28", features = ["derive"] }
svgdom = "0.18"
sysinfo = "0.39"
tiny-skia = { version = "0.12", default-features = false, features = [
    "simd",
    "std",
] }
typemap = { package = "typemap-ors", version = "1" }
usvg = "0.47"
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = "29"
whoami = "2"

profiling = { version = "1", features = [
    "profile-with-puffin",
], optional = true }
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }
wgpu-profiler = { version = "0.27", optional = true, features = ["puffin"] }

[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = [
    "crypto-rust",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.dev.package."*"]
opt-level = 3

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gled", dest = "/usr/bin/gled", mode = "555" },
    { source = ".rpm/de.photonenkollektiv.gled.desktop", dest = "/usr/share/applications/de.photonenkollektiv.gled.desktop", mode = "444" },
    { source = ".rpm/gled.repo", dest = "/etc/yum.repos.d/gled.repo", mode = "444" },
    { source = "logo/logo.svg", dest = "/usr/share/icons/application-gled.svg", mode = "444" },
]

[package.metadata.packager]
product-name = "Gled"
identifier = "de.photonenkollektiv.gled"
resources = ["logo/logo.png", "logo/logo.icns"]
icons = ["logo/logo.png", "logo/logo.icns"]
macos = { "signingIdentity" = "Developer ID Application: FreshX GmbH (V5GQY7AUWA)" }

[patch.crates-io]
wgpu-profiler = { git = "https://github.com/elwerene/wgpu-profiler", branch = "update_dependencies" }

[features]
profiling = [
    "dep:profiling",
    "dep:puffin",
    "dep:puffin_http",
    "dep:wgpu-profiler",
]
