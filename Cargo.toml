[package]
name = "gled"
version = "2.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
artnet_protocol = "0.4"
chrono = "0.4"
clap = { version = "4.2", features = ["derive"] }
eframe = { version = "0.27", features = [
    "wgpu",
    "default_fonts",
    "wayland",
], default-features = false }
egui = { version = "0.27", features = ["persistence"] }
egui_extras = { version = "0.27", features = ["image"] }
fern = { version = "0.6", features = ["colored"] }
gilrs = "0.10"
gled_proc_macros = { path = "proc_macros" }
home = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
kurbo = "0.11"
log = "0.4"
once_cell = "1.17"
resvg = { version = "0.40", default-features = false }
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svgdom = "0.18"
strum = { version = "0.26", features = ["derive"] }
tiny-skia = { version = "0.11", default-features = false, features = [
    "simd",
    "std",
] }
usvg = "0.40"
wgpu = "0.19"
rand = "0.8"
network-interface = "1.1"
directories = "5.0"
git2 = "0.18"
whoami = "1.5"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"

[profile.dev.package."*"]
opt-level = 3
