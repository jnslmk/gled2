[package]
name = "gled"
description = "gled is an application for creating animations and effects on artnet or dmx installations"
version = "2.22.3"
edition = "2024"
repository = "https://gitlab.com/photonenkollektiv/gled2"
homepage = "https://photonenkollektiv.gitlab.io/gled2"
documentation = "https://photonenkollektiv.gitlab.io/gled2"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
arboard = "3"
artnet_protocol = "0.4"
atomic_float = "1"
chrono = "0.4"
cpal = "0.17"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.33", features = [
    "wgpu",
    "default_fonts",
    "wayland",
], default-features = false }
egui = { version = "0.33", features = ["persistence"] }
egui_dnd = "0.14"
egui_extras = { version = "0.33", features = ["image", "syntect"] }
egui_flex = "0.5"
egui_knob = "0.3.6"
egui_ltreeview = { version = "0.6", features = ["persistence"] }
egui-modal.git = "https://github.com/elwerene/egui-modal"
egui-phosphor = "0.11"
emath = "0.33"
env_logger = "0.11"
epaint = "0.33"
gilrs = "0.11"
git2 = "0.20"
home = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
kurbo = "0.13"
log = "0.4"
midir = { version = "0.10", features = ["winrt"] }
mkdirp = "1"
naga = "27"
ndarray = "0.16"
network-interface = "2"
notify-rust = { version = "4", default-features = false, features = ["d"] }
once_cell = "1"
open = "5"
polyfit-residuals = "0.6"
polyfit-rs = "0.2"
rand = "0.9"
rayon = "1.10"
reqwest = { version = "0.13", features = ["blocking", "json"] }
resvg = { version = "0.45", default-features = false }
rfd = "0.16"
rustfft = "6"
rusty_link = "0.4"
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde-hjson = "1"
serde_json = "1"
serialport = "4"
static_assertions = "1"
strum = { version = "0.27", features = ["derive"] }
svgdom = "0.18"
sysinfo = "0.37"
tiny-skia = { version = "0.11", default-features = false, features = [
    "simd",
    "std",
] }
typemap = "0.3"
usvg = "0.45"
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = "27"
whoami = "1"

profiling = { version = "1", features = [
    "profile-with-puffin",
], optional = true }
puffin = { version = "0.19", optional = true }
puffin_http = { version = "0.16", optional = true }
wgpu-profiler = { version = "0.25", optional = true, features = ["puffin"] }

[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[profile.dev.package."*"]
opt-level = 3

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gled", dest = "/usr/bin/gled", mode = "555" },
    { source = ".rpm/de.photonenkollektiv.gled.desktop", dest = "/usr/share/applications/de.photonenkollektiv.gled.desktop", mode = "444" },
    { source = ".rpm/gled.repo", dest = "/etc/yum.repos.d/gled.repo", mode = "444" },
    { source = "logo/logo.svg", dest = "/usr/share/icons/application-gled.svg", mode = "444" },
]

[package.metadata.packager]
product-name = "Gled"
identifier = "de.photonenkollektiv.gled"
resources = ["logo/logo.png", "logo/logo.icns"]
icons = ["logo/logo.png", "logo/logo.icns"]
macos = { "signingIdentity" = "Developer ID Application: FreshX GmbH (V5GQY7AUWA)" }

[features]
profiling = [
    "dep:profiling",
    "dep:puffin",
    "dep:puffin_http",
    "dep:wgpu-profiler",
]
