[target.x86_64-pc-windows-msvc]
rustflags = ["-Clink-arg=/STACK:8000000", "-Ctarget-feature=+avx2"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Ctarget-feature=+avx2"]

[target.x86_64-apple-darwin]
rustflags = ["-Ctarget-feature=+avx2"]

# Build fixes (not upstream): the eframe patch lives on the `gled2-patch`
# branch of the fork below. Remove it once upstream ships the change.
#   - eframe 0.36.1: adds an app-settable `SKIP_PAINTING` flag so a hidden
#     window can keep running app logic (and therefore output) on Wayland.
#     See src/main.rs. Fork: jnslmk/egui @ gled2-patch (standalone 0.36.1).
#   - rusty_link needed no patch: with the system libclang the unpatched
#     registry crate builds in both profiles with layout tests enabled.
[patch.crates-io]
eframe = { git = "https://github.com/jnslmk/egui", branch = "gled2-patch" }
