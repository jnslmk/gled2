compile_job:
  stage: prepare
  image: rust:1.83
  rules:
  - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - bash bundle.sh
  artifacts:
    paths:
    - "bin/gled-$CI_COMMIT_TAG.x86_64.rpm"
    - "bin/gled_$CI_COMMIT_TAG_x64-setup.exe"


release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
    needs:
    - job: compile_job
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  script:
    - echo "Creating release"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: ''
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Container Image $CI_COMMIT_TAG'
          url: "https://$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"